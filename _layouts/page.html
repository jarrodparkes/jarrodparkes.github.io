---
layout: default
---
{% assign page_language = page.languages | first | default: "en" %}
<article class="post" lang="{{ page_language }}">
    {% if page.title %}
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
    </header>
    {% endif %}
    <div class="post-body">
        {{ content }}
    </div>
</article>
