<header class="post-header">
    <p class="post-kicker">
        <span class="label label-{{ page.layout }}">{{ page.layout }}</span>
        <span class="post-date">{{ page.date | date: site.date_format }}</span>
        {% include languages.html languages=page.languages %}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.where %}<p class="post-meta">{{ page.where }}</p>{% endif %}
    {% if page.tags.size > 0 %}<p class="post-meta">{{ page.tags | join: " " | remove: "," | split: " " | join: " · " }}</p>{% endif %}
</header>
